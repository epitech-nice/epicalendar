apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: epicalendar

# namespace.yaml is applied once by a cluster admin (cluster-scoped).
# Secrets are created by the deploy workflow, see *-secret.example.yaml.
resources:
    - mongodb-pvc.yaml
    - mongodb-configmap.yaml
    - mongodb-deployment.yaml
    - server-deployment.yaml
    - client-deployment.yaml
    - ingress.yaml
