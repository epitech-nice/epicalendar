# Shape only: not applied by kustomize.
# The real Secret is created by the deploy workflow from GitHub Secrets.
apiVersion: v1
kind: Secret
metadata:
    name: mongodb-secret
    namespace: epicalendar
type: Opaque
stringData:
    MONGO_INITDB_ROOT_USERNAME: <username>
    MONGO_INITDB_ROOT_PASSWORD: <password>
    MONGO_INITDB_DATABASE: epicalendar_db
    MONGODB_URI: mongodb://<username>:<password>@mongodb-service:27017/epicalendar?authSource=admin
